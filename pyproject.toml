[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydateinfer"
version = "0.4.0"
description = "Infers date format from examples"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Jeffrey Starr" },
    { name = "Will McGinnis", email = "will@pedalwrencher.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pytz"]

[project.urls]
Homepage = "https://github.com/wdm0006/dateinfer"
Repository = "https://github.com/wdm0006/dateinfer"

[dependency-groups]
dev = ["pyyaml>=6"]

[tool.hatch.build.targets.wheel]
packages = ["dateinfer"]

[tool.hatch.build.targets.sdist]
include = ["dateinfer", "docs", "CHANGELOG.md", "README.md", "LICENSE"]
